<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Community security roadmap</title>
  <desc id="desc">A responsible workflow for ecosystem-scale Skill collection, scanning, validation, disclosure, and publication.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6Z" fill="#64748b"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".12"/></filter></defs>
  <rect width="1200" height="420" rx="26" fill="#f8fafc"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="55" y="60" font-size="28" font-weight="800" fill="#0f172a">From a detector to shared ecosystem defense</text>
    <text x="55" y="91" font-size="16" fill="#64748b">Planned public-interest workflow for major Agent Skills platforms</text>
    <g filter="url(#s)">
      <rect x="55" y="145" width="180" height="150" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <rect x="280" y="145" width="180" height="150" rx="22" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
      <rect x="505" y="145" width="180" height="150" rx="22" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
      <rect x="730" y="145" width="180" height="150" rx="22" fill="#fdf4ff" stroke="#a21caf" stroke-width="2"/>
      <rect x="955" y="145" width="190" height="150" rx="22" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    </g>
    <g text-anchor="middle"><text x="145" y="188" font-size="18" font-weight="800" fill="#1e3a8a">1 · SNAPSHOT</text><text x="145" y="222" font-size="14" fill="#475569">versioned public corpus</text><text x="145" y="247" font-size="14" fill="#475569">provenance + license</text><text x="145" y="272" font-size="14" fill="#475569">reproducible hashes</text>
      <text x="370" y="188" font-size="18" font-weight="800" fill="#155e75">2 · STATIC SCAN</text><text x="370" y="222" font-size="14" fill="#475569">zero-execution analysis</text><text x="370" y="247" font-size="14" fill="#475569">evidence + coverage</text><text x="370" y="272" font-size="14" fill="#475569">ranked review queue</text>
      <text x="595" y="188" font-size="18" font-weight="800" fill="#92400e">3 · VALIDATE</text><text x="595" y="222" font-size="14" fill="#475569">independent review</text><text x="595" y="247" font-size="14" fill="#475569">false-positive control</text><text x="595" y="272" font-size="14" fill="#475569">reproducible evidence</text>
      <text x="820" y="188" font-size="18" font-weight="800" fill="#86198f">4 · DISCLOSE</text><text x="820" y="222" font-size="14" fill="#475569">notify maintainers</text><text x="820" y="247" font-size="14" fill="#475569">coordinate remediation</text><text x="820" y="272" font-size="14" fill="#475569">protect active secrets</text>
      <text x="1050" y="188" font-size="18" font-weight="800" fill="#166534">5 · PUBLISH</text><text x="1050" y="222" font-size="14" fill="#475569">confirmed advisories</text><text x="1050" y="247" font-size="14" fill="#475569">benchmarks + rules</text><text x="1050" y="272" font-size="14" fill="#475569">community statistics</text></g>
    <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"><path d="M235 220h34"/><path d="M460 220h34"/><path d="M685 220h34"/><path d="M910 220h34"/></g>
    <text x="600" y="357" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Public claims follow confirmation. Detection flags are never presented as prevalence.</text>
  </g>
</svg>
